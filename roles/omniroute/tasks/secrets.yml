---
- name: Check if .secrets.env already exists on target host
  ansible.builtin.stat:
    path: "{{ omniroute_config_dir }}/.secrets.env"
  register: omniroute_secrets_file_stat

- name: Slurp existing .secrets.env if present
  ansible.builtin.slurp:
    path: "{{ omniroute_config_dir }}/.secrets.env"
  register: omniroute_existing_secrets_slurp
  when: omniroute_secrets_file_stat.stat.exists

- name: Parse existing secrets from .secrets.env
  ansible.builtin.set_fact:
    omniroute_existing_secrets: "{{ (omniroute_existing_secrets_slurp.content | b64decode | from_yaml) | default({}, true) }}"
  when: omniroute_secrets_file_stat.stat.exists

- name: Generate or resolve runtime secrets
  ansible.builtin.set_fact:
    omniroute_effective_jwt_secret: >-
      {{
        omniroute_jwt_secret
        if omniroute_jwt_secret != ''
        else (omniroute_existing_secrets.JWT_SECRET | default(lookup('password', '/dev/null length=48 chars=ascii_letters,digits') | b64encode, true))
      }}
    omniroute_effective_api_key_secret: >-
      {{
        omniroute_api_key_secret
        if omniroute_api_key_secret != ''
        else (omniroute_existing_secrets.API_KEY_SECRET | default(lookup('password', '/dev/null length=64 chars=hexdigits') | lower, true))
      }}
    omniroute_effective_storage_encryption_key: >-
      {{
        omniroute_storage_encryption_key
        if omniroute_storage_encryption_key != ''
        else (omniroute_existing_secrets.STORAGE_ENCRYPTION_KEY | default(lookup('password', '/dev/null length=64 chars=hexdigits') | lower, true))
      }}
    omniroute_effective_initial_password: >-
      {{
        omniroute_initial_password
        if omniroute_initial_password != ''
        else (omniroute_existing_secrets.INITIAL_PASSWORD | default(lookup('password', '/dev/null length=24 chars=ascii_letters,digits'), true))
      }}
    omniroute_effective_ws_bridge_secret: >-
      {{
        omniroute_ws_bridge_secret
        if omniroute_ws_bridge_secret != ''
        else (omniroute_existing_secrets.OMNIROUTE_WS_BRIDGE_SECRET |
              default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode, true))
      }}
    omniroute_effective_redis_password: >-
      {{
        omniroute_redis_password
        if omniroute_redis_password != ''
        else (omniroute_existing_secrets.OMNIROUTE_REDIS_PASSWORD |
              default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true))
      }}
  no_log: true

- name: Persist .secrets.env on target host
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ omniroute_config_dir }}/.secrets.env"
    owner: "{{ omniroute_user }}"
    group: "{{ omniroute_group }}"
    mode: "0600"
  no_log: true
  notify: restart omniroute
